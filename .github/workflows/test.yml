name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (no npm install needed, node built-ins only)
        run: node --test test/*.test.js
      - name: Study library check
        run: node library/check.js
