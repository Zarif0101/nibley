<!doctype html>
<html><head><meta charset="utf-8"><title>Nibley video 2</title>
<link rel="stylesheet" href="common.css">
<script src="../../../src/overlay/mascot.js"></script>
<script src="marks.js"></script>
<script src="common.js"></script>
</head><body>
<div id="stage"><div id="cap"></div></div>
<script>
const stage = document.getElementById('stage');
const { lap, screen, wrap } = buildLaptop(stage);
const CAM = { wrap, F: [450, 360], T: [540, 700], in: 12.0, out: 17.4 };
// ---- lecture video: slide area 900x500 + generic player bar ----
const slide = h('div', { className: 'abs', style: { left: 0, top: 0, width: '900px', height: '500px', background: '#fff' } }, screen);
h('div', { className: 'abs', style: { left: '44px', top: '30px', fontWeight: 700, fontSize: '44px', lineHeight: '54px' } }, slide, 'Forces on a block at rest');
h('div', { className: 'abs', style: { left: '44px', top: '92px', fontWeight: 400, fontSize: '28px', lineHeight: '38px' } }, slide, 'Two forces act. Draw both.');
const ssvg = sv('svg', { class: 'pen', width: 900, height: 500, viewBox: '0 0 900 500' }, slide);
lectureArt(ssvg, { cx: 330, floor: 440, s: 2.3 });
for (const k of ['v2_weight', 'v2_up']) MARKS[k].forEach((d) => printedPath(ssvg, d));
h('div', { className: 'abs', style: { left: '340px', top: '388px', fontWeight: 400, fontSize: '28px', lineHeight: '34px' } }, slide, 'weight');
const bar = h('div', { className: 'abs', style: { left: 0, top: '500px', width: '900px', height: '60px', background: '#2B3A4B' } }, screen);
sv('svg', { width: 40, height: 60, viewBox: '0 0 40 60', style: 'position:absolute;left:18px;top:0' }, bar).innerHTML = '<path d="M10 20 L28 30 L10 40 Z" fill="#fff"/>';
h('div', { className: 'abs', style: { left: '70px', top: '27px', width: '440px', height: '6px', borderRadius: '3px', background: '#6B7A90' } }, bar);
const fill = h('div', { className: 'abs', style: { left: '70px', top: '27px', height: '6px', borderRadius: '3px', background: '#2F8BFF' } }, bar);
const dot = h('div', { className: 'abs', style: { top: '21px', width: '18px', height: '18px', borderRadius: '9px', background: '#fff' } }, bar);
const clock = h('div', { className: 'abs', style: { left: '540px', top: '11px', fontWeight: 600, fontSize: '38px', lineHeight: '46px', color: '#fff' } }, bar, '');
const skip = h('div', { className: 'abs', style: { left: '560px', top: '404px', background: '#1E6FEB', color: '#fff', fontWeight: 600, fontSize: '52px', lineHeight: '64px', padding: '8px 26px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(43,58,75,.28)', opacity: 0 } }, slide, '−10 s');
// ---- ten browser windows ----
const TITLES = ['normal force, explained', 'why the block does not fall', "Newton's third law, simply", 'free body diagram help', 'normal force vs weight', 'physics forum: stuck on N', 'lecture notes week 4', 'forces practice quiz', 'is normal force always up?', 'mass vs weight'];
const wins = TITLES.map((title, i) => {
  const w = h('div', { className: 'abs', style: { left: (30 + i * 28) + 'px', top: (26 + i * 17 + (i % 3) * 14) + 'px', width: '560px', height: '330px', background: '#fff', border: '1px solid #E6EEF8', borderRadius: '12px', boxShadow: '0 2px 8px rgba(43,58,75,.28)', overflow: 'hidden' } }, screen);
  h('div', { className: 'abs', style: { left: 0, top: 0, width: '560px', height: '48px', background: '#F7FAFF', borderBottom: '1px solid #E6EEF8' } }, w);
  h('div', { className: 'abs', style: { left: '16px', top: '8px', height: '40px', padding: '0 18px', background: '#fff', border: '1px solid #E6EEF8', borderBottom: 'none', borderRadius: '8px 8px 0 0', fontWeight: 600, fontSize: '20px', lineHeight: '38px', color: '#2B3A4B', whiteSpace: 'nowrap' } }, w, title);
  const bars = [[70, 300, 12], [104, 460, 8], [124, 420, 8], [144, 440, 8], [182, 200, 12], [212, 470, 8], [232, 380, 8], [252, 450, 8]];
  bars.forEach(([y, wd, hh], j) => h('div', { className: 'abs', style: { left: '28px', top: y + 'px', width: (wd - ((i * 37 + j * 53) % 80)) + 'px', height: hh + 'px', borderRadius: '4px', background: j === 0 || j === 4 ? '#6B7A90' : '#E6EEF8' } }, w));
  return w;
});
// ---- Nibley's marks ----
const psvg = sv('svg', { class: 'pen', width: 900, height: 500, viewBox: '0 0 900 500' }, slide);
const ringA = new Mark(psvg, MARKS.v2_ring_arrow);
const ring1 = new Mark(psvg, MARKS.v2_ring_floor);
const ring2 = new Mark(psvg, MARKS.v2_ring_weight);
const chip = h('div', { className: 'chip', style: { left: '392px', top: '196px', opacity: 0 } }, slide, 'normal force');
const st1 = h('div', { className: 'step', style: { left: '468px', top: '350px', opacity: 0 } }, slide, '1');
const st2 = h('div', { className: 'step', style: { left: '504px', top: '408px', opacity: 0 } }, slide, '2');
const nib = new Mascot(slide, 8);
const keys = buildKeys(stage, 60, 1350);
const end = buildEndCard(stage); end.root.style.display = 'none';

const cap = captions([
  { a: 0.3, b: 3.5, text: 'Rewound it three times. Still lost.' },
  { a: 3.6, b: 8.0, text: "Ten tabs later, you've lost the thread." },
  { a: 8.1, b: 12.0, text: 'Hold the hotkey. Ask.' },
  { a: 12.1, b: 18.0, text: 'It answers on the slide itself.' },
  { a: 18.5, b: 24.0, text: 'Free on GitHub.', top: 1170 },
]);
const BX = 600, BY = 290;
function nibley(t) {
  if (t < 9.4) return nib.place(0, 0, 0, 0, 0);
  const bob = Math.round(Math.sin(t * 4.2)) * 4;
  let face = 'happy', s = backOut(pr(t, 9.4, 0.4));
  if (t >= 10.0 && t < 13.1) face = 'listening';
  else if (t >= 13.1 && t < 13.6) face = 'thinking';
  else if (t >= 13.6 && t < 17.9) face = Math.floor(t / 0.17) % 2 ? 'speaking' : 'happy';
  nib.set(face); nib.place(BX, BY + bob, s, 0, 1);
}
const clockText = (f) => { const sec = Math.round(f * 3150); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + ' / 52:30'; };

window.seek = (t) => {
  laptopTilt(lap, t, 18.0, CAM);
  // player: plays on, jumps back at 0.9 / 1.7 / 2.5
  const jumps = [0.9, 1.7, 2.5].filter((j) => t >= j).length;
  const last = jumps ? [0.9, 1.7, 2.5][jumps - 1] : 0.1;
  const fp = Math.min(0.30 + Math.max(0, t - last) * 0.25, 0.5);
  fill.style.width = (440 * fp) + 'px'; dot.style.left = (70 + 440 * fp - 9) + 'px'; clock.textContent = clockText(fp);
  let so = 0; for (const j of [0.9, 1.7, 2.5]) so = Math.max(so, pr(t, j, 0.08) * (1 - pr(t, j + 0.45, 0.15)));
  skip.style.opacity = so;
  // tabs stack 3.9..7.5, then fly away 8.2..
  wins.forEach((w, i) => {
    const a = ease(pr(t, 3.9 + i * 0.38, 0.22)), o = ease(pr(t, 8.2 + (9 - i) * 0.04, 0.3));
    w.style.display = a <= 0 || o >= 1 ? 'none' : 'block';
    w.style.opacity = a * (1 - o);
    w.style.transform = `translateY(${((1 - a) * 40 + o * 400).toFixed(1)}px)`;
  });
  nibley(t);
  keys(t, 8.5, 9.0, 13.2, 14.0);
  ringA.set(t, 13.1, 0.45);
  chipShow(chip, t, 13.6);
  ring2.set(t, 15.2, 0.45);
  ring1.set(t, 16.7, 0.45);
  const s1 = pr(t, 15.5, 0.18), s2 = pr(t, 17.0, 0.18);
  st1.style.opacity = s1 * (1 - 0.65 * s2); st1.style.transform = `translateX(${(1 - s1) * -12}px)`;
  st2.style.opacity = s2; st2.style.transform = `translateX(${(1 - s2) * -12}px)`;
  cap(t);
  // end card
  const e = pr(t, 18.4, 0.4);
  end.root.style.display = e > 0 ? 'block' : 'none';
  const hop = t >= 22.4 && t < 23.1 ? -Math.abs(Math.sin(((t - 22.4) / 0.7) * Math.PI * 2)) * 30 : 0;
  const bob = Math.round(Math.sin(t * 4.2)) * 4;
  end.m.set('happy'); end.m.place(80, 435 + (hop || bob), 1, hop ? 6 : 0, ease(e));
  [end.word, end.url, end.small].forEach((el, i) => {
    const p = ease(pr(t, 18.6 + i * 0.12, 0.3));
    el.style.opacity = p; el.style.transform = `translateY(${((1 - p) * 14).toFixed(1)}px)`;
  });
  end.um.set(t, 19.4, 0.45);
};
document.fonts.ready.then(() => { window.READY = true; window.seek(0); });
</script></body></html>
