<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
  :root { --ink: #2F8BFF; --deep: #1E6FEB; --swipe: #FFD98C; --text: #2B3A4B; --white: #FFFFFF; --shadow: 0 2px 8px rgba(43, 58, 75, .28); }
  html, body { margin: 0; width: 1366px; height: 768px; overflow: hidden; background: transparent; font-family: 'Inter'; user-select: none; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #layer, #swipes { position: absolute; inset: 0; }
  .pen { fill: none; stroke: var(--ink); stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
  .edge { fill: none; stroke-width: 6.5px; stroke-linecap: round; stroke-linejoin: round; }
  .swipe { position: absolute; transform-origin: left center; }
  .swipe polygon { fill: var(--swipe); fill-opacity: .45; mix-blend-mode: multiply; }
  .chip { position: absolute; background: var(--deep); color: var(--white); border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow);
          font: 600 14px/20px 'Inter'; white-space: nowrap; }
  .step { position: absolute; width: 28px; height: 28px; border-radius: 8px; background: var(--deep); color: var(--white); box-shadow: var(--shadow);
          font: 700 16px/28px 'Inter'; text-align: center; }
  .done { opacity: .35; }
  #sub { position: absolute; display: none; box-sizing: border-box; width: max-content; max-width: 760px; padding: 8px 16px; border-radius: 8px;
         background: var(--text); color: var(--white); box-shadow: var(--shadow); font: 600 20px/28px 'Inter'; text-align: center; }
  #status { position: absolute; display: none; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px;
            background: var(--white); color: var(--text); box-shadow: var(--shadow); font: 600 13px/16px 'Inter'; white-space: nowrap; }
  #status.listening { background: var(--deep); color: var(--white); }
  #status .face svg { position: static; display: block; width: 28px; height: 28px; }
  #status .bars { display: none; gap: 2px; align-items: center; height: 16px; }
  #status .bars span { width: 3px; height: 4px; border-radius: 2px; background: currentColor; }
  #status .dots { display: none; gap: 3px; }
  #status .dots span { width: 4px; height: 4px; border-radius: 2px; background: var(--ink); }
</style>
</head>
<body>
  <img id="bg" alt="">
  <div id="swipes"></div>
  <svg id="svg"></svg>
  <div id="layer"></div>
  <div id="sub"></div>
  <div id="status"><span class="face" id="face"></span><span class="bars" id="bars"><span></span><span></span><span></span></span><span class="dots" id="dots"><span></span><span></span><span></span></span><span id="word"></span></div>
  <script src="overlay.js"></script>
</body>
</html>
