<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
  :root { --ink: #2F8BFF; --deep: #1E6FEB; --text: #2B3A4B; --white: #FFFFFF; --shadow: 0 2px 8px rgba(43, 58, 75, .28); }
  html, body { margin: 0; width: 1366px; height: 768px; overflow: hidden; background: transparent; font-family: 'Inter'; user-select: none; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #layer { position: absolute; inset: 0; }
  .pen { fill: none; stroke: var(--ink); stroke-width: 3.5px; stroke-linecap: round; stroke-linejoin: round; }
  .edge { fill: none; stroke-width: 6.5px; stroke-linecap: round; stroke-linejoin: round; }
  .pen.thin { stroke-width: 2px; } .edge.thin { stroke-width: 5px; } .pen.soft { stroke-width: 3px; } .edge.soft { stroke-width: 6px; }
  .card { position: absolute; box-sizing: border-box; padding: 10px 12px 12px; border-radius: 12px; background: var(--white); box-shadow: var(--shadow); }
  .card .k { display: flex; align-items: center; gap: 8px; font: 600 15px/20px 'Inter'; color: var(--deep); }
  .card .num { width: 22px; height: 22px; flex: none; border-radius: 6px; background: var(--deep); color: var(--white); font: 700 13px/22px 'Inter'; text-align: center; }
  .card .v { margin-top: 4px; font: 400 14px/20px 'Inter'; color: var(--text); }
  #back { position: absolute; left: 24px; top: 24px; display: none; align-items: center; gap: 6px; padding: 8px 14px; border: 0; border-radius: 8px; cursor: pointer;
          background: var(--white); color: var(--deep); box-shadow: var(--shadow); font: 600 14px/20px 'Inter'; }
  #back:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #sub { position: absolute; display: none; box-sizing: border-box; width: max-content; max-width: 760px; padding: 8px 16px; border-radius: 8px;
         background: var(--text); color: var(--white); box-shadow: var(--shadow); font: 600 20px/28px 'Inter'; text-align: center; }
  #status-wrap { position: absolute; left: 0; right: 0; bottom: 184px; display: flex; justify-content: center; pointer-events: none; }
  #status { position: relative; display: none; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px;
            background: var(--white); color: var(--text); box-shadow: var(--shadow); font: 600 13px/16px 'Inter'; white-space: nowrap; }
  #status.listening { background: var(--deep); color: var(--white); }
  #status .face svg { position: static; display: block; width: 28px; height: 28px; }
  #status .bars { display: none; gap: 2px; align-items: center; height: 16px; }
  #status .bars span { width: 3px; height: 4px; border-radius: 2px; background: currentColor; }
  #status .dots { display: none; gap: 3px; }
  #status .dots span { width: 4px; height: 4px; border-radius: 2px; background: var(--ink); }
</style>
</head>
<body>
  <img id="bg" alt="">
  <svg id="svg"></svg>
  <div id="layer"></div>
  <button id="back"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="position:static;width:14px;height:14px"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to lessons</button>
  <div id="sub"></div>
  <div id="status-wrap"><div id="status"><span class="face" id="face"></span><span class="bars" id="bars"><span></span><span></span><span></span></span><span class="dots" id="dots"><span></span><span></span><span></span></span><span id="word"></span></div></div>
  <script src="overlay.js"></script>
</body>
</html>
