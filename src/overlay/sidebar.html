<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nibley</title>
<!-- Floating sidebar (docs/DESIGN.md "Sidebar", mockup design/sidebar-mockup.html OK'd 2026-11-08). Study + Lessons + Settings.
     Study page: design/study-page-mockup.html (OK'd 2026-11-08), src/study.js. -->
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2); }
  :root { --swipe: rgba(255,217,140,.45); --error: #FF8B7A; --ink: #2F8BFF; --deep: #1E6FEB; --sky: #4DA3FF; --text: #2B3A4B; --muted: #6B7A90; --bg: #F7FAFF; --line: #E6EEF8;
          --card-shadow: 0 1px 3px rgba(43,58,75,.08); --ease: cubic-bezier(.3,.7,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 14px/20px Inter, sans-serif; display: flex; flex-direction: column; border-left: 1px solid var(--line); overflow: hidden; user-select: none; }
  button:focus-visible, .lesson:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .head b { font: 600 16px/24px Inter; flex: 1; }
  .m3d { display: block; width: 32px; height: 32px; background: url(mascot3d/happy.webp) no-repeat 0 0 / 960px 32px; animation: m 2.5s steps(30) infinite; }
  @keyframes m { to { background-position: -960px 0; } }
  .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .nav { display: flex; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .nav button { font: 600 14px/20px Inter; padding: 8px 4px 10px; margin: 0 16px -1px 0; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--deep); }
  .panel { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: none; }
  .panel.on { display: block; }
  .row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .label { font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .hint { color: var(--muted); font-size: 12px; line-height: 16px; margin-top: 6px; }
  .seg { display: flex; background: #FFFFFF; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { flex: 1; font: 600 13px/18px Inter; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--deep); color: #FFFFFF; }
  .voice { display: flex; gap: 8px; }
  select { flex: 1; min-width: 0; font: 400 14px/20px Inter; color: var(--text); background: #FFFFFF; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .play { font: 600 13px/18px Inter; border: 1.5px solid var(--deep); color: var(--deep); background: #FFFFFF; border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .play:hover { border-color: var(--ink); }
  .switch { width: 40px; height: 24px; flex: none; border-radius: 12px; background: var(--line); border: 0; position: relative; cursor: pointer; transition: background 150ms; }
  .switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: var(--card-shadow); transition: left 150ms var(--ease); }
  .switch[aria-checked="true"] { background: var(--deep); }
  .switch[aria-checked="true"]::after { left: 19px; }
  .lesson { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px; margin-top: 12px; background: #FFFFFF; border: 1px solid var(--line);
            border-radius: 12px; box-shadow: var(--card-shadow); cursor: pointer; transition: border-color 120ms; }
  .lesson:hover { border-color: var(--sky); }
  .lesson img { width: 112px; height: 63px; object-fit: cover; border-radius: 8px; display: block; }
  .lesson b { display: block; font: 600 14px/18px Inter; }
  .lesson p { margin: 4px 0; font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lesson small { color: var(--muted); font-size: 12px; }
  .empty { margin-top: 24px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-weight: 600; }
  /* Study page */
  .lec { margin: 12px 0 4px; font: 600 18px/24px Inter; user-select: text; }
  .meta { display: flex; gap: 8px; color: var(--muted); font-size: 12px; line-height: 16px; margin-bottom: 4px; }
  .live { color: var(--deep); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--deep); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h3 { font: 600 12px/16px Inter; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
  .note { color: var(--muted); font-size: 13px; }
  .idea { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); user-select: text; }
  .idea:last-child { border-bottom: 0; }
  .idea.new span { background: linear-gradient(var(--swipe), var(--swipe)) no-repeat 0 100% / 0% 40%; animation: swipe 900ms 300ms var(--ease) forwards; }
  @keyframes swipe { to { background-size: 100% 40%; } }
  .t { font: 600 12px/20px Inter; color: var(--deep); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; align-self: start; }
  .t:hover { text-decoration: underline; }
  .card { background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow); padding: 12px; margin-bottom: 8px; user-select: text; }
  .qa .q { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .qa .a { margin-top: 4px; }
  .quiz .q { font-weight: 600; margin-bottom: 8px; }
  .opts { display: flex; gap: 8px; }
  .o { flex: 1; font: 600 14px/20px Inter; padding: 8px; border-radius: 8px; border: 1.5px solid var(--deep); background: #FFFFFF; color: var(--deep); cursor: pointer; }
  .o:hover { border-color: var(--ink); }
  .o.right { background: var(--deep); color: #FFFFFF; }
  .o.wrong { border-color: var(--error); color: var(--text); }
  .o:disabled { cursor: default; }
  .fb { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .score { font-weight: 600; margin: 4px 0 0; }
  .cards { padding: 0; }
  .fc { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .fc:last-child { border-bottom: 0; }
  .box { width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 1.5px solid var(--deep); display: grid; place-items: center; }
  .fc[aria-checked="true"] .box { background: var(--deep); }
  .fc[aria-checked="false"] .box svg { display: none; }
  .fc[aria-checked="false"] .f, .fc[aria-checked="false"] .b { color: var(--muted); text-decoration: line-through; }
  .fc .f { font-weight: 600; }
  .fc .b { font-size: 13px; }
  .miss { font-size: 12px; line-height: 16px; color: var(--deep); font-weight: 600; }
  .foot { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 16px; }
  .foot b { color: var(--text); }
  .analyze { padding: 14px; }
  .analyze b { display: block; font-weight: 600; margin-bottom: 4px; }
  .analyze p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .go { font: 600 14px/20px Inter; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--deep); color: #FFFFFF; cursor: pointer; }
  .go:hover { background: var(--ink); }
  .go:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .chap { padding: 8px 0; border-bottom: 1px solid var(--line); user-select: text; }
  .chap:last-child { border-bottom: 0; }
  .chap-head { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-weight: 600; }
  .chap ul { margin: 4px 0 0 60px; padding: 0 0 0 14px; }
  .chap li { margin: 2px 0; }
  .basics { margin: 0; padding-left: 18px; user-select: text; }
  @media (prefers-reduced-motion: reduce) { .m3d, .live::before, .idea.new span { animation: none; } .idea.new span { background-size: 100% 40%; } .switch, .switch::after, .lesson { transition: none; } }
</style>
</head>
<body>
  <div class="head">
    <span class="m3d" aria-hidden="true"></span>
    <b>Nibley</b>
    <button class="icon-btn" id="close" aria-label="Close sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="nav" role="tablist">
    <button role="tab" id="t-study" aria-selected="true" aria-controls="p-study">Study</button>
    <button role="tab" id="t-lessons" aria-selected="false" aria-controls="p-lessons">Lessons</button>
    <button role="tab" id="t-settings" aria-selected="false" aria-controls="p-settings">Settings</button>
  </div>

  <div class="panel on" id="p-study" role="tabpanel" aria-labelledby="t-study"><div id="study"></div></div>

  <div class="panel" id="p-settings" role="tabpanel" aria-labelledby="t-settings">
    <div class="row">
      <div class="label">Model</div>
      <div class="seg" data-key="model"><button data-v="haiku">Haiku</button><button data-v="sonnet">Sonnet</button></div>
      <div class="hint">Haiku answers in about 2 seconds. Sonnet is slower and better at long working-outs.</div>
    </div>
    <div class="row">
      <div class="label"><label for="voice">Voice</label></div>
      <div class="voice">
        <select id="voice"></select>
        <button class="play" id="sample"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M1 1l8 5-8 5z" fill="currentColor"/></svg>Sample</button>
      </div>
    </div>
    <div class="row">
      <div class="label">Opening sites and apps</div>
      <div class="seg" data-key="mode"><button data-v="ask">Ask first</button><button data-v="auto">Auto</button></div>
      <div class="hint">New sites always ask first, even in Auto.</div>
    </div>
    <div class="row">
      <div class="label"><span id="ear-label">Listen to the lecture</span><button class="switch" id="ear" role="switch" aria-labelledby="ear-label"></button></div>
      <div class="hint">Nibley hears the last minute of the video, so it knows what the teacher just said.</div>
    </div>
  </div>

  <div class="panel" id="p-lessons" role="tabpanel" aria-labelledby="t-lessons"><div id="list"></div></div>

<script>
const { ipcRenderer } = require('electron');
const $ = (id) => document.getElementById(id);
let s = {};

function render() {
  document.querySelectorAll('.seg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(s[g.dataset.key] === b.dataset.v))));
  $('voice').value = s.voice;
  $('ear').setAttribute('aria-checked', String(s.ear !== false));
}
async function load() {
  s = await ipcRenderer.invoke('settings:get');
  $('voice').replaceChildren(...s.voices.map(([label, id]) => Object.assign(document.createElement('option'), { value: id, textContent: label })));
  render();
}
const set = async (key, value) => { s = await ipcRenderer.invoke('settings:set', key, value); render(); };
document.querySelectorAll('.seg').forEach((g) => g.querySelectorAll('button').forEach((b) => { b.onclick = () => set(g.dataset.key, b.dataset.v); }));
$('voice').onchange = (e) => set('voice', e.target.value);
$('sample').onclick = () => ipcRenderer.send('voice:sample');
$('ear').onclick = () => set('ear', s.ear === false);
$('close').onclick = () => ipcRenderer.send('sidebar:toggle', 'x');
addEventListener('keydown', (e) => { if (e.key === 'Escape') ipcRenderer.send('sidebar:toggle', 'esc'); });

function tab(which) {
  for (const t of ['study', 'lessons', 'settings']) {
    $(`t-${t}`).setAttribute('aria-selected', String(t === which));
    $(`p-${t}`).classList.toggle('on', t === which);
  }
  if (which === 'lessons') lessons();
}
$('t-study').onclick = () => tab('study');
$('t-settings').onclick = () => tab('settings');
$('t-lessons').onclick = () => tab('lessons');

const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }); };
async function lessons() {
  const items = await ipcRenderer.invoke('lessons:list');
  const list = $('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty"><b>No lessons yet.</b>Say "save this" after an explanation.</div>';
    return;
  }
  list.replaceChildren(...items.map((l) => {
    const c = document.createElement('div');
    c.className = 'lesson';
    c.tabIndex = 0;
    c.setAttribute('role', 'button');
    c.setAttribute('aria-label', `Play lesson: ${l.title}`);
    const img = Object.assign(document.createElement('img'), { src: l.thumb, alt: '' });
    const t = document.createElement('div');
    t.append(Object.assign(document.createElement('b'), { textContent: l.title }));
    if (l.question) t.append(Object.assign(document.createElement('p'), { textContent: `You asked: ${l.question}` }));
    t.append(Object.assign(document.createElement('small'), { textContent: when(l.date) }));
    c.append(img, t);
    const play = () => ipcRenderer.send('lessons:play', l.dir);
    c.onclick = play;
    c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } };
    return c;
  }));
}
// ---------- Study page (src/study.js sends the whole page on every change) ----------
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const clock = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const timeBtn = (t) => { const b = el('button', 't', clock(t)); b.setAttribute('aria-label', `Open the video at ${clock(t)} in a new tab`); b.onclick = () => ipcRenderer.send('study:seek', t); return b; };
const TICK = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let seenIdeas = null; // ideas already shown: only new ones get the highlighter swipe
function study(p) {
  const root = $('study');
  if (!p) {
    const e = el('div', 'empty');
    e.append(el('b', null, 'No lecture yet.'), 'Play a lecture on YouTube. Its study page builds here while you watch.');
    root.replaceChildren(e);
    seenIdeas = null;
    return;
  }
  const out = [el('div', 'lec', p.title)];
  const meta = el('div', 'meta');
  meta.append(p.ended ? el('span', null, 'Finished') : el('span', 'live', 'Watching'));
  out.push(meta);

  if (p.canAnalyze || p.analyzed === 'working') { // read the whole lecture now, before or while he watches
    const c = el('div', 'card analyze'), go = el('button', 'go', p.analyzed === 'working' ? 'Reading the whole lecture...' : 'Analyze this video');
    c.append(el('b', null, 'Know the whole lecture first'), el('p', null, 'Nibley reads the full video now: chapters, key ideas, what to know first and the tricky parts. About 30 seconds.'), go);
    go.disabled = p.analyzed === 'working';
    go.onclick = () => { go.disabled = true; go.textContent = 'Reading the whole lecture...'; ipcRenderer.send('study:analyze'); };
    out.push(c);
  }
  if (p.analyzed === true) {
    if (p.prereqs?.length) {
      out.push(el('h3', null, 'Know this first'));
      const ul = el('ul', 'basics'); p.prereqs.forEach((x) => ul.append(el('li', null, x))); out.push(ul);
    }
    out.push(el('h3', null, p.analyzedTo ? `Chapters (up to ${clock(p.analyzedTo)})` : 'Chapters'));
    for (const ch of p.chapters) {
      const c = el('div', 'chap'), head = el('div', 'chap-head'), ul = el('ul');
      head.append(timeBtn(ch.t), el('span', null, ch.title));
      ch.ideas.forEach((x) => ul.append(el('li', null, x)));
      c.append(head, ul);
      out.push(c);
    }
    if (p.tricky?.length) {
      out.push(el('h3', null, 'Tricky parts'));
      for (const x of p.tricky) { const row = el('div', 'idea'); row.append(timeBtn(x.t), el('span', null, x.text)); out.push(row); }
    }
  }
  if (p.analyzed !== true || p.ideas.length) out.push(el('h3', null, 'Key ideas'));
  if (!p.ideas.length && p.analyzed !== true) out.push(el('div', 'note', 'Every 10 minutes, Nibley writes down what the teacher covered.'));
  for (const i of p.ideas) {
    const row = el('div', `idea${!seenIdeas || seenIdeas.has(i.at) ? '' : ' new'}`);
    row.append(timeBtn(i.t), el('span', null, i.text));
    out.push(row);
  }
  seenIdeas = new Set(p.ideas.map((i) => i.at));

  out.push(el('h3', null, 'Your questions'));
  if (!p.questions.length) out.push(el('div', 'note', 'Ask anything while you watch. It lands here with the video time.'));
  for (const q of p.questions) {
    const c = el('div', 'card qa'), head = el('div', 'q');
    head.append(el('span', null, q.q), timeBtn(q.t));
    c.append(head, el('div', 'a', q.a));
    out.push(c);
  }

  if (p.ended && (p.quiz.length || p.cards.length)) {
    out.push(el('h3', null, 'Quick check'));
    p.quiz.forEach((q, i) => {
      const c = el('div', 'card quiz'), opts = el('div', 'opts');
      c.append(el('div', 'q', `${i + 1}. ${q.q}`));
      q.o.forEach((o, k) => {
        const b = el('button', 'o', o); b.dataset.k = `o${i}-${k}`;
        if (q.picked !== null) { b.disabled = true; if (k === q.r) b.classList.add('right'); else if (k === q.picked) b.classList.add('wrong'); }
        b.onclick = () => ipcRenderer.send('study:answer', i, k);
        opts.append(b);
      });
      c.append(opts);
      if (q.picked !== null) c.append(el('div', 'fb', (q.picked === q.r ? 'Right. ' : 'Not quite. ') + q.why + (q.picked === q.r ? '' : ' Added as a card.')));
      out.push(c);
    });
    if (p.quiz.length && p.quiz.every((q) => q.picked !== null)) out.push(el('div', 'score', `${p.quiz.filter((q) => q.picked === q.r).length} of ${p.quiz.length} right.`));

    out.push(el('h3', null, 'Your cards'));
    const list = el('div', 'card cards');
    p.cards.forEach((c, i) => {
      const row = el('div', 'fc'); row.dataset.k = `fc${i}`;
      row.setAttribute('role', 'checkbox'); row.tabIndex = 0; row.setAttribute('aria-checked', String(c.keep));
      const box = el('span', 'box'); box.innerHTML = TICK;
      const txt = el('span');
      if (c.miss) txt.append(el('div', 'miss', 'From your quick check'));
      txt.append(el('div', 'f', c.f), el('div', 'b', c.b));
      row.append(box, txt);
      const flip = () => ipcRenderer.send('study:card', i);
      row.onclick = flip; row.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
      list.append(row);
    });
    out.push(list);
    const foot = el('div', 'foot'), n = p.cards.filter((c) => c.keep).length;
    foot.append(el('b', null, `${n} card${n === 1 ? '' : 's'}`), " go into tomorrow's review. Untick any you don't want.");
    out.push(foot);
  }
  const panel = $('p-study'), atBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight < 40;
  const focused = document.activeElement?.dataset?.k; // keep keyboard focus across the re-render
  root.replaceChildren(...out);
  if (focused) root.querySelector(`[data-k="${focused}"]`)?.focus({ preventScroll: true });
  if (atBottom && seenIdeas.size) panel.scrollTop = panel.scrollHeight; // follow new lines only when he was already at the bottom
}
ipcRenderer.on('study:page', (_e, p) => study(p));
ipcRenderer.invoke('study:get').then(study);

ipcRenderer.on('sidebar:section', (_e, which) => tab(which));

ipcRenderer.on('settings:changed', load);
load();
</script>
</body>
</html>
