<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nibley lessons</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  :root { --ink: #2F8BFF; --bg: #F7FAFF; --line: #E6EEF8; --muted: #6B7A90; --text: #2B3A4B; --sky: #A7E3FF; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/24px 'Inter'; }
  main { padding: 24px 32px 32px; max-width: 880px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  h1 { margin: 0; font: 600 24px/32px 'Inter'; }
  .card { display: grid; grid-template-columns: 192px 1fr; gap: 16px; align-items: start; padding: 12px; margin-bottom: 12px; background: #FFFFFF;
          border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 3px rgba(43, 58, 75, .08); cursor: pointer; outline: none;
          transition: box-shadow 150ms ease, border-color 150ms ease; }
  .card:hover { border-color: var(--sky); box-shadow: 0 4px 14px rgba(43, 58, 75, .12); }
  .card:focus-visible { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .thumb { width: 192px; aspect-ratio: 1366 / 768; border-radius: 8px; display: block; background: var(--line); }
  .title { font: 600 18px/24px 'Inter'; margin: 4px 0; overflow-wrap: anywhere; }
  .question { color: var(--muted); font-size: 14px; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .date { color: var(--muted); font-size: 12px; line-height: 16px; margin-top: 8px; }
  .empty { display: flex; align-items: center; gap: 16px; padding: 24px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; }
  .empty b { display: block; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <header><span id="logo"></span><h1>Lessons</h1></header>
  <div id="list"></div>
</main>
<script>
  const { ipcRenderer } = require('electron');
  const mascot = require(require('node:path').join(__dirname, 'mascot.js'));
  const list = document.getElementById('list');
  const ink = new URLSearchParams(location.search).get('ink');
  if (/^#[0-9a-f]{6}$/i.test(ink || '')) document.documentElement.style.setProperty('--ink', ink);
  document.getElementById('logo').innerHTML = mascot.svg('happy', 40);
  const fmt = (iso) => new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const make = (tag, cls, text) => { const e = document.createElement(tag); e.className = cls; if (text) e.textContent = text; return e; };
  async function load() {
    const items = await ipcRenderer.invoke('lessons:list');
    list.replaceChildren();
    if (!items.length) {
      const e = make('div', 'empty');
      const face = make('span', '');
      face.innerHTML = mascot.svg('happy', 56);
      const t = make('div', '');
      t.append(make('b', '', 'No lessons yet.'), document.createTextNode('Say "save this" after an explanation.'));
      e.append(face, t);
      return list.append(e);
    }
    for (const l of items) {
      const card = make('div', 'card');
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `Play lesson: ${l.title}`);
      const img = make('img', 'thumb');
      img.src = l.thumb;
      img.alt = '';
      const text = make('div', '');
      text.append(make('div', 'title', l.title), make('div', 'question', l.question ? `You asked: ${l.question}` : ''), make('div', 'date', fmt(l.date)));
      card.append(img, text);
      const play = () => ipcRenderer.send('lessons:play', l.dir);
      card.addEventListener('click', play);
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
      list.append(card);
    }
    list.querySelector('.card')?.focus();
  }
  addEventListener('focus', load);
  load();
</script>
</body>
</html>
